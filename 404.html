<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 - Page Not Found | Stackly Jewellers</title>
<meta name="description" content="Page not found.">
<meta name="theme-color" content="#16261f">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#16261f;--gold:#b8923a;--gold-l:#d9b96a;--ivory:#f4efe4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ivory);font-family:"Jost",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 38%,rgba(184,146,58,.18) 0%,rgba(184,146,58,0) 55%),var(--bg)}
.nf{width:100%;max-width:560px}
.eyebrow{display:block;margin-bottom:6px;color:var(--gold-l);font-size:13px;font-weight:500;letter-spacing:.3em;text-transform:uppercase}
.code{font-family:"Cormorant Garamond",serif;font-weight:500;line-height:.95;letter-spacing:.04em;font-size:clamp(96px,26vh,200px);color:var(--gold-l)}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(26px,4.6vh,40px);line-height:1.2;margin:10px 0 14px}
h1 em{font-style:italic;color:var(--gold-l)}
p{max-width:440px;margin:0 auto clamp(18px,4vh,32px);line-height:1.7;color:rgba(244,239,228,.75);font-size:15px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:999px;font:500 13px/1 "Jost",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:.2s}
.b svg{width:16px;height:16px}
.b.p{background:var(--gold);border:1px solid var(--gold);color:#fff}
.b.p:hover{filter:brightness(1.1)}
.b.s{border:1px solid rgba(244,239,228,.4);color:var(--ivory)}
.b.s:hover{border-color:var(--gold-l);color:var(--gold-l)}
.b:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}
@media(max-height:520px){.code{font-size:84px}p{display:none}h1{margin-bottom:18px}}
</style>
</head>
<body>
<main class="nf">
  <span class="eyebrow">Error</span>
  <div class="code">404</div>
  <h1>This piece seems to be <em>missing</em></h1>
  <p>The page you are looking for has moved or never existed. Let us help you find something beautiful instead.</p>
  <div class="acts">
    <a class="b p" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Go Home</a>
    <a class="b s" href="login.html" id="goBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Go Back</a>
  </div>
</main>
<script>
/* Go Back: return to the previous page (e.g. Login); falls back to login.html if there is no history */
document.getElementById('goBack').addEventListener('click',function(e){
  if(window.history.length>1){e.preventDefault();window.history.back();}
});
</script>
</body>
</html>
